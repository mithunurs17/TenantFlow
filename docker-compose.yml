services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tenantflow
      POSTGRES_USER: tenantflow
      POSTGRES_PASSWORD: tenantflow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
  worker:
    build: ./backend
    env_file: .env
    depends_on: [backend, redis]
    command: celery -A config worker -l info
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on: [backend]
volumes:
  pgdata:

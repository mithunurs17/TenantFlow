<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="color-scheme" content="dark light"/>
<meta name="theme-color" content="#01061a"/>
<meta name="description" content="TenantFlow: multi-tenant project management. Your team’s work, planned together."/>
<title>TenantFlow</title>
<link rel="preconnect" href="https://d8j0ntlcm91z4.cloudfront.net" crossorigin/>
<script>
  /* Apply the saved theme before first paint so there is no flash of the wrong theme. */
  try{var t=localStorage.getItem('tf_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}
</script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
